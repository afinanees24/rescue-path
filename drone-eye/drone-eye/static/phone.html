<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drone-Eye · Phone camera uplink</title>
<style>
  body{margin:0;background:#000;color:#fff;font:16px system-ui,-apple-system,sans-serif;text-align:center}
  video{width:100vw;height:75vh;object-fit:cover;background:#111}
  button{font-size:18px;padding:14px 26px;margin:14px;border-radius:12px;border:0;background:#e8423a;color:#fff}
  #status{color:#aaa;font-size:14px}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<div><button id="go">Start drone camera</button></div>
<div id="status">Point the rear camera at the burned-house photos.</div>
<canvas id="c" style="display:none"></canvas>
<script>
const v = document.getElementById('v'), c = document.getElementById('c'), st = document.getElementById('status');
const FPS = 8, WIDTH = 960;
let ws, sent = 0;
document.getElementById('go').onclick = async () => {
  if (!navigator.mediaDevices?.getUserMedia) {
    st.textContent = 'Camera blocked: this page must be opened over HTTPS (see README).'; return;
  }
  const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}, audio:false});
  v.srcObject = stream;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/phone`);
  ws.binaryType = 'arraybuffer';
  ws.onmessage = e => st.textContent = e.data;
  ws.onclose = () => st.textContent = 'Disconnected — reload to retry.';
  ws.onopen = () => {
    setInterval(() => {
      if (!v.videoWidth || ws.readyState !== 1 || ws.bufferedAmount > 200000) return;
      const s = WIDTH / v.videoWidth;
      c.width = WIDTH; c.height = Math.round(v.videoHeight * s);
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
      c.toBlob(b => b && b.arrayBuffer().then(buf => { ws.send(buf); sent++; st.textContent = `Streaming to drone pipeline · ${sent} frames`; }), 'image/jpeg', 0.7);
    }, 1000 / FPS);
  };
};
</script>
</body>
</html>
