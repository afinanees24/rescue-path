<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone-Eye · Wildfire Property Assessment</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c222b; --line:#2a313c; --text:#e6edf3; --muted:#8b949e;
    --accent:#e8423a; --ok:#4caf50; --affected:#ffeb3b; --minor:#ffc107; --major:#ff7000; --destroyed:#f44336; --unknown:#8b949e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);background:#0b0e13}
  header h1{font-size:16px;margin:0;letter-spacing:.04em}
  header h1 b{color:var(--accent)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  .chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .chip.live{color:#7ee787;border-color:#2ea04366}
  .chip.warn{color:#f0b72f;border-color:#f0b72f66}
  main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(360px,1fr);gap:14px;padding:14px;height:calc(100vh - 49px)}
  .col{display:flex;flex-direction:column;gap:14px;min-height:0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:0}
  .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
  #video{width:100%;border-radius:8px;background:#000;display:block;aspect-ratio:16/9;object-fit:contain}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer;font:inherit}
  button:hover{border-color:#58a6ff}
  button.primary{background:#1f6feb;border-color:#1f6feb}
  button.on{background:#238636;border-color:#238636}
  #map{flex:1;min-height:220px;border-radius:8px}
  .addr{font-size:19px;font-weight:650;margin:0}
  .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .badge{font-weight:700;padding:5px 11px;border-radius:6px;color:#111}
  .bar{flex:1;min-width:120px;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
  .bar>div{height:100%}
  .money{font-size:26px;font-weight:700}
  .small{font-size:12px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  td{padding:3px 0;border-bottom:1px dashed var(--line)} td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .comps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
  .comp{background:var(--panel2);border-radius:6px;padding:6px;font-size:11px;text-align:center;border-top:3px solid var(--unknown)}
  .comp b{display:block;font-size:12px;text-transform:capitalize}
  ul{margin:6px 0 0;padding-left:18px}
  .scroll{overflow:auto}
  .alert{border-left:4px solid var(--accent);background:#2a1214;border-radius:6px;padding:8px 10px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
  .alert.ack{opacity:.45;background:var(--panel2);border-color:var(--line)}
  .alert.fire{border-color:var(--major);background:#2a1b10}
  .alert .src{font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;background:#00000055;text-transform:uppercase}
  .alert .body{flex:1}
  .blink{animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.35}}
  .snap{width:100%;border-radius:6px;margin-top:10px;border:1px solid var(--line)}
  .empty{color:var(--muted);font-style:italic}
  .disclaimer{font-size:11px;color:var(--muted);margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
</style>
</head>
<body>
<header>
  <h1><b>DRONE-EYE</b> · Wildfire Property Assessment</h1>
  <div class="chips" id="chips"></div>
</header>
<main>
  <div class="col">
    <div class="panel">
      <img id="video" src="/video.mjpg" alt="drone feed">
      <div class="controls">
        <button onclick="post('/api/sim/step/-1')">◀ Prev house</button>
        <button onclick="post('/api/sim/step/1')">Next house ▶</button>
        <button id="tourBtn" onclick="toggleTour()">Auto-tour</button>
        <button class="primary" onclick="post('/api/assess_now')">Assess now</button>
        <span style="flex:1"></span>
        <button onclick="location.href='/api/report.csv'">Export claims CSV</button>
        <button onclick="window.open('/api/report')">JSON report</button>
      </div>
    </div>
    <div class="panel" style="flex:1;display:flex;flex-direction:column">
      <h2>Survey map</h2>
      <div id="map"></div>
    </div>
  </div>

  <div class="col">
    <div class="panel scroll" style="flex:0 1 auto;max-height:42%">
      <h2>Signs of life <span id="lifeCount"></span></h2>
      <div id="alerts"><div class="empty">No signs of life detected yet.</div></div>
    </div>
    <div class="panel scroll" style="flex:1">
      <h2>Property in view</h2>
      <div id="property"><div class="empty">Waiting for drone...</div></div>
    </div>
  </div>
</main>

<script>
const CAT = {
  "No Damage":["var(--ok)","#4caf50"], "Affected (1-9%)":["var(--affected)","#ffeb3b"], "Minor (10-25%)":["var(--minor)","#ffc107"],
  "Major (26-50%)":["var(--major)","#ff7000"], "Destroyed (>50%)":["var(--destroyed)","#f44336"], "Unknown":["var(--unknown)","#8b949e"]
};
const LVL = {none:"#4caf50",minor:"#ffeb3b",moderate:"#ffc107",severe:"#ff7000",destroyed:"#f44336",not_visible:"#8b949e"};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const usd = n => n == null ? "—" : "$" + Number(n).toLocaleString();
const ago = t => { const s = Math.round(Date.now()/1000 - t); return s < 60 ? s + "s ago" : Math.round(s/60) + "m ago"; };
async function post(url, body){ await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})}); }
let tourOn = false;
function toggleTour(){ post('/api/sim/tour',{on:!tourOn, dwell_s:8}); }

// ---------- map ----------
let map, droneMk, rayLine, parcelMk = {}, alertMk = {}, mapReady = false;
async function initMap(){
  if (typeof L === 'undefined'){ $('map').innerHTML = '<div class="empty" style="padding:20px">Map tiles need internet (Leaflet + OpenStreetMap).</div>'; return; }
  const r = await (await fetch('/api/parcels')).json();
  map = L.map('map',{zoomControl:true}).setView([r.center.lat, r.center.lon], 18);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap'}).addTo(map);
  for (const p of r.parcels){
    const m = L.circleMarker([p.lat,p.lon],{radius:9,color:'#fff',weight:1.5,fillColor:CAT.Unknown[1],fillOpacity:.9}).addTo(map);
    m.bindTooltip(`${esc(p.address)}<br>${esc(p.parcel_id)}`);
    m.on('click',()=>post('/api/sim/goto/'+p.parcel_id));
    parcelMk[p.parcel_id] = m;
  }
  droneMk = L.marker([r.center.lat, r.center.lon],{icon:L.divIcon({className:'',html:'<div style="font-size:22px;transform:translate(-4px,-8px)">🛸</div>'})}).addTo(map);
  rayLine = L.polyline([],{color:'#58a6ff',dashArray:'4 6'}).addTo(map);
  mapReady = true;
}

function renderMap(s){
  if(!mapReady) return;
  const L0 = s.live; if(!L0.pose) return;
  for (const [pid,cat] of Object.entries(s.parcel_status)){
    const m = parcelMk[pid]; if(!m) continue;
    m.setStyle({fillColor:(CAT[cat]||CAT.Unknown)[1], weight: pid===L0.target_parcel_id?4:1.5, color: pid===L0.target_parcel_id?'#58a6ff':'#fff'});
  }
  droneMk.setLatLng([L0.pose.lat, L0.pose.lon]);
  rayLine.setLatLngs([[L0.pose.lat,L0.pose.lon],[L0.look_point.lat,L0.look_point.lon]]);
  for (const a of s.alerts){
    if (a.kind!=='life' || a.lat==null || alertMk[a.id]) continue;
    alertMk[a.id] = L.circleMarker([a.lat,a.lon],{radius:16,color:'#e8423a',weight:3,fill:false,className:'blink'}).addTo(map)
      .bindTooltip(`${esc(a.source)}: ${esc(a.label)}`);
  }
}

// ---------- panels ----------
function renderChips(s){
  const l = s.live, p = l.pose || {};
  const chips = [
    [`Camera: ${l.camera||'—'}`, ''],
    [`Detector: ${l.detector||'—'}`, ''],
    [`${l.fps||0} fps`, ''],
    [p.live ? 'Telemetry: LIVE' : 'Telemetry: SIM', p.live ? 'live':'warn'],
    [l.assessing ? 'AI assessing…' : `AI calls: ${l.assess_calls||0}`, l.assessing ? 'live':''],
  ];
  if (l.assess_error) chips.push([`AI error → offline fallback`, 'warn']);
  $('chips').innerHTML = chips.map(([t,c])=>`<span class="chip ${c}" title="${esc(l.assess_error||'')}">${esc(t)}</span>`).join('');
  tourOn = !!p.tour_on; $('tourBtn').classList.toggle('on', tourOn);
  $('tourBtn').textContent = tourOn ? 'Auto-tour: ON' : 'Auto-tour';
}

function renderAlerts(s){
  const al = s.alerts;
  const open = al.filter(a=>!a.acknowledged && a.kind==='life').length;
  $('lifeCount').innerHTML = open ? `<span class="blink" style="color:var(--accent)">● ${open} open</span>` : '';
  if (!al.length) return;
  $('alerts').innerHTML = al.map(a=>`
    <div class="alert ${a.acknowledged?'ack':''} ${a.kind==='fire'?'fire':''}">
      <span class="src">${esc(a.source)}</span>
      <div class="body"><b>${esc(a.label)}</b><br>
        <span class="small">${esc(a.address||'unknown location')} · ${ago(a.last_seen)} · conf ${a.confidence}${a.count>1?` · ×${a.count}`:''}
        ${a.occupants_on_file!=null?`<br>On file: ${a.occupants_on_file} occupant(s), ${a.pets_on_file} pet(s)`:''}</span></div>
      ${a.acknowledged?'':`<button onclick="post('/api/alerts/${a.id}/ack')">Ack</button>`}
    </div>`).join('');
}

function renderProperty(s){
  const v = s.current, l = s.live;
  if (!v){
    $('property').innerHTML = `<div class="empty">No parcel on file at the camera's look point${l.target_address?`<br>Nearest address: ${esc(l.target_address)}`:''}.</div>`;
    return;
  }
  const p = v.parcel, a = v.assessment, e = v.estimate, pol = p.policy||{};
  let h = `<p class="addr">${esc(p.address)}</p>
    <div class="meta">${esc(p.parcel_id)} · Policy ${esc(pol.policy_number||'—')} · ${esc(p.structure_type)}, ${p.stories} story, ${Number(p.sqft).toLocaleString()} sqft, built ${p.year_built}<br>
    ${esc(p.construction)} · ${esc(p.roof_type)} roof · Coverage A ${usd(pol.coverage_a_dwelling)} · Deductible ${usd(pol.deductible)}</div>`;
  if (!a){ $('property').innerHTML = h + `<div class="row empty">${l.assessing?'AI assessment in progress…':'Awaiting assessment…'}</div>`; return; }
  const c = CAT[a.damage_category]||CAT.Unknown;
  h += `<div class="row"><span class="badge" style="background:${c[0]}">${esc(a.damage_category)}</span>
        <div class="bar"><div style="width:${a.damage_percent||0}%;background:${c[0]}"></div></div>
        <span>${Math.round(a.damage_percent||0)}%</span><span class="small">conf ${(a.confidence??0).toFixed(2)}</span></div>`;
  if (a.active_fire) h += `<div class="row blink" style="color:var(--major);font-weight:700">🔥 Active fire on structure</div>`;
  if (e && e.status==='ok'){
    h += `<div class="row" style="align-items:baseline"><span class="money">${usd(e.range_low)} – ${usd(e.range_high)}</span>
          <span class="small">est. net claim${e.total_loss?' · TOTAL LOSS':''}</span></div>
      <table>
        <tr><td>Dwelling (Cov A)</td><td>${usd(e.lines.dwelling_cov_a)}</td></tr>
        <tr><td>Other structures (Cov B)</td><td>${usd(e.lines.other_structures_cov_b)}</td></tr>
        <tr><td>Contents (Cov C)</td><td>${usd(e.lines.contents_cov_c)}</td></tr>
        <tr><td>Debris removal</td><td>${usd(e.lines.debris_removal)}</td></tr>
        <tr><td>Less deductible</td><td>−${usd(e.deductible)}</td></tr>
        <tr><td><b>Point estimate</b></td><td><b>${usd(e.net_estimate)}</b></td></tr>
      </table>
      <div class="small">Replacement basis ${usd(e.replacement_cost)} (${e.assumptions.sqft} sqft × $${e.assumptions.rebuild_cost_per_sqft}/sqft)</div>`;
  }
  if (a.components){
    h += `<div class="comps">` + Object.entries(a.components).map(([k,lv])=>
      `<div class="comp" style="border-top-color:${LVL[lv]||LVL.not_visible}"><b>${esc(k.replace(/_/g,' '))}</b>${esc(lv.replace('_',' '))}</div>`).join('') + `</div>`;
  }
  h += `<div class="row" style="display:block"><b>Adjuster notes</b><br>${esc(a.adjuster_summary)}</div>`;
  if (a.hazards?.length) h += `<div class="row" style="display:block"><b style="color:var(--major)">Hazards</b><ul>${a.hazards.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  if (a.recommended_actions?.length) h += `<div class="row" style="display:block"><b>Recommended actions</b><ul>${a.recommended_actions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  if (a._snapshot) h += `<img class="snap" src="${a._snapshot}?t=${Math.round(a._timestamp)}" alt="evidence frame">`;
  h += `<div class="disclaimer">${esc(a._engine)} · ${a._latency_s}s · ${v.n_assessments} pass(es). AI triage estimate for adjuster review — not a coverage determination; field verification required.</div>`;
  $('property').innerHTML = h;
}

async function tick(){
  try{
    const s = await (await fetch('/api/state')).json();
    if (s.live && s.live.pose){ renderChips(s); renderAlerts(s); renderProperty(s); renderMap(s); }
  }catch(e){ console.warn(e); }
  setTimeout(tick, 700);
}
initMap().catch(console.warn);
tick();
</script>
</body>
</html>
